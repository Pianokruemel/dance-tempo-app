name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with Commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk dancetempo-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk dancetempo-${SHORT_SHA}.apk

      - name: Update Rolling 'latest' Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DanceTempo Latest Build"
          tag_name: "latest"
          prerelease: true
          draft: false
          body: |
            ## 💃 DanceTempo — Neueste Entwickler-Version (Rolling Pre-Release)
            
            Dieser Release wird bei jedem Push auf den `main`-Branch automatisch neu gebaut und aktualisiert.
            
            - **Commit:** `${{ github.sha }}`
            - **Datum:** ${{ github.event.head_commit.timestamp }}
            - **Commit-Nachricht:** ${{ github.event.head_commit.message }}
            
            ### 📥 Download
            Lade die Datei **`dancetempo-latest.apk`** auf dein Android-Smartphone herunter und installiere sie.
          files: |
            dancetempo-latest.apk
            dancetempo-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
